
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Adonis Hub Key System</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --black: #050505;
    --dark: #0d0d0d;
    --gray: #777;
    --silver: #dcdcdc;
    --white: #fff;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--black);
    color: white;
    font-family: Inter, sans-serif;
}

/* ================= BACKGROUND ================= */

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 40%, #242424, transparent 48%),
        radial-gradient(circle at 0% 100%, #1c1c1c, transparent 40%),
        #050505;
    z-index: -5;
    animation: backgroundPulse 8s ease-in-out infinite;
}

@keyframes backgroundPulse {
    0%,100% { filter: brightness(.8); }
    50% { filter: brightness(1.15); }
}

.grid {
    position: fixed;
    inset: -100%;
    width: 300%;
    height: 300%;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 45px 45px;
    transform: perspective(500px) rotateX(55deg);
    animation: gridMove 25s linear infinite;
    z-index: -4;
}

@keyframes gridMove {
    to {
        transform: perspective(500px) rotateX(55deg) translateY(45px);
    }
}

.glow {
    position: fixed;
    width: 330px;
    height: 330px;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    animation: glowFloat 12s ease-in-out infinite alternate;
}

.glow1 {
    top: -150px;
    left: -100px;
    background: rgba(255,255,255,.09);
}

.glow2 {
    bottom: -150px;
    right: -100px;
    background: rgba(160,160,160,.08);
    animation-delay: -5s;
}

.glow3 {
    top: 40%;
    left: 60%;
    background: rgba(255,255,255,.035);
    animation-delay: -2s;
}

@keyframes glowFloat {
    to {
        transform: translate(100px, 80px) scale(1.3);
    }
}

/* SCANNER */

.scanner {
    position: fixed;
    left: 0;
    top: -150px;
    width: 100%;
    height: 140px;
    background: linear-gradient(
        transparent,
        rgba(255,255,255,.025),
        rgba(255,255,255,.055),
        transparent
    );
    animation: scanner 8s linear infinite;
    pointer-events: none;
    z-index: -1;
}

@keyframes scanner {
    to { top: 110%; }
}

/* BACKGROUND FLASHES */

.flash-light {
    position: fixed;
    width: 2px;
    height: 2px;
    background: white;
    box-shadow: 0 0 30px 8px rgba(255,255,255,.12);
    animation: flashLight 5s ease infinite;
}

@keyframes flashLight {
    0%,100% { opacity: 0; transform: scale(1); }
    50% { opacity: .8; transform: scale(2); }
}

/* ================= CARD ================= */

.card {
    width: 92%;
    max-width: 440px;
    position: relative;
    padding: 34px 25px 27px;
    border-radius: 27px;
    background: rgba(10,10,10,.95);
    border: 1px solid #292929;
    overflow: hidden;
    box-shadow:
        0 30px 100px rgba(0,0,0,.8),
        0 0 60px rgba(255,255,255,.025);
    backdrop-filter: blur(25px);
    animation: cardEnter 1s cubic-bezier(.16,1,.3,1);
    transition: transform .25s ease, box-shadow .4s ease;
}

@keyframes cardEnter {
    0% {
        opacity: 0;
        transform: translateY(45px) scale(.92);
        filter: blur(8px);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

/* CARD ROTATING BORDER */

.card-border {
    position: absolute;
    inset: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(
        from 0deg,
        transparent,
        #555,
        #fff,
        #777,
        transparent 25%,
        transparent 70%,
        #aaa,
        #fff,
        transparent
    );
    animation: borderRotate 10s linear infinite;
    opacity: .2;
}

@keyframes borderRotate {
    to { transform: rotate(360deg); }
}

.card-inner {
    position: absolute;
    inset: 1px;
    border-radius: 26px;
    background: linear-gradient(145deg, #151515, #080808);
    z-index: 1;
}

.content {
    position: relative;
    z-index: 3;
}

/* CARD LIGHT FOLLOW */

.card-light {
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,.055);
    filter: blur(60px);
    pointer-events: none;
    z-index: 2;
    left: -100px;
    top: -100px;
    transition: left .25s, top .25s;
}

/* ================= LOGO ================= */

.logo-area {
    width: 120px;
    height: 120px;
    margin: 0 auto 22px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* OUTER RING */

.outer-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid #333;
    border-top-color: #eee;
    border-right-color: #777;
    animation: rotate 7s linear infinite;
}

.outer-ring::before {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    top: 10px;
    left: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 15px #fff;
}

.outer-ring::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    bottom: 12px;
    right: 20px;
    border-radius: 50%;
    background: #999;
    box-shadow: 0 0 10px #aaa;
}

.inner-ring {
    position: absolute;
    inset: 10px;
    border: 1px dashed rgba(255,255,255,.16);
    border-radius: 50%;
    animation: rotateReverse 14s linear infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
    to { transform: rotate(-360deg); }
}

/* LOGO TILE */

.logo-tile {
    width: 84px;
    height: 84px;
    border-radius: 24px;
    background: linear-gradient(145deg, #333, #141414, #070707);
    border: 1px solid #555;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow:
        0 0 35px rgba(255,255,255,.08),
        inset 0 1px 15px rgba(255,255,255,.09),
        inset 0 -10px 20px rgba(0,0,0,.7);
    animation: logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

/* SHINE */

.logo-tile::before {
    content: "";
    position: absolute;
    width: 150%;
    height: 45%;
    left: -150%;
    top: 15%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.3),
        transparent
    );
    transform: rotate(-35deg);
    animation: logoShine 3.8s ease infinite;
}

@keyframes logoShine {
    0%,20% { left: -150%; }
    65%,100% { left: 150%; }
}

/* LOGO A */

.logo-svg {
    width: 59px;
    height: 65px;
    position: relative;
    z-index: 2;
    overflow: visible;
    animation: logoGlow 3s ease-in-out infinite;
}

@keyframes logoGlow {
    0%,100% {
        filter: drop-shadow(0 0 2px rgba(255,255,255,.15));
    }
    50% {
        filter: drop-shadow(0 0 10px rgba(255,255,255,.3));
    }
}

.logo-svg .letter {
    fill: url(#metal);
    stroke: rgba(255,255,255,.5);
    stroke-width: .5;
    stroke-linejoin: bevel;
}

.logo-svg .bar {
    fill: url(#barMetal);
}

.logo-tile:hover {
    transform: scale(1.07) rotate(0deg);
    border-color: #aaa;
}

/* ================= TITLE ================= */

.title {
    font-family: Orbitron, sans-serif;
    font-size: 24px;
    font-weight: 900;
    text-align: center;
    letter-spacing: 2px;
    color: #f2f2f2;
    animation: titleGlow 4s ease infinite;
}

.title span {
    color: #888;
}

@keyframes titleGlow {
    0%,100% { text-shadow: 0 0 10px rgba(255,255,255,.04); }
    50% { text-shadow: 0 0 22px rgba(255,255,255,.18); }
}

.subtitle {
    text-align: center;
    margin-top: 9px;
    color: #666;
    font-size: 10px;
    letter-spacing: 4px;
}

/* ================= STATUS MENU ================= */

.status {
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    margin: 24px 0;
    padding: 12px;
    border-radius: 30px;
    background: linear-gradient(90deg, #0c0c0c, #1a1a1a, #0c0c0c);
    background-size: 200% 100%;
    border: 1px solid #2b2b2b;
    animation: statusGradient 5s ease infinite;
}

@keyframes statusGradient {
    50% { background-position: 100% 0; }
}

.status::before {
    content: "";
    position: absolute;
    left: -100%;
    top: 0;
    width: 70%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
    animation: statusScan 4s infinite;
}

@keyframes statusScan {
    to { left: 150%; }
}

.dot {
    width: 7px;
    height: 7px;
    background: #eee;
    border-radius: 50%;
    box-shadow: 0 0 10px #fff;
    animation: dotPulse 1.5s infinite;
}

@keyframes dotPulse {
    50% {
        opacity: .3;
        transform: scale(.65);
        box-shadow: 0 0 0 transparent;
    }
}

.status-text {
    font-size: 10px;
    color: #aaa;
    letter-spacing: 2px;
    font-weight: 700;
}

/* ================= KEY MENU ================= */

.key-section {
    position: relative;
    padding: 14px;
    margin-top: 5px;
    border: 1px solid #242424;
    border-radius: 17px;
    background: linear-gradient(145deg, #111, #080808);
    overflow: hidden;
    transition: .4s ease;
    animation: keySectionEnter 1.2s ease both;
}

@keyframes keySectionEnter {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Animated menu border */

.key-section::before {
    content: "";
    position: absolute;
    inset: -100%;
    background: conic-gradient(
        transparent 0%,
        transparent 65%,
        #777 75%,
        #fff 80%,
        #555 85%,
        transparent 100%
    );
    animation: keyBorderSpin 7s linear infinite;
    opacity: .25;
}

.key-section::after {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: 16px;
    background: linear-gradient(145deg, #101010, #080808);
    z-index: 0;
}

@keyframes keyBorderSpin {
    to { transform: rotate(360deg); }
}

.key-content {
    position: relative;
    z-index: 2;
}

/* MENU HEADER */

.key-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
}

.key-header-left {
    display: flex;
    align-items: center;
    gap: 9px;
}

.key-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(145deg, #303030, #111);
    border: 1px solid #454545;
    color: #ccc;
    font-size: 14px;
    animation: keyIconPulse 3s infinite;
}

@keyframes keyIconPulse {
    0%,100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
    50% { box-shadow: 0 0 12px rgba(255,255,255,.12); }
}

.key-header-title {
    font-size: 11px;
    color: #ddd;
    letter-spacing: 1.5px;
    font-weight: 800;
}

.key-badge {
    padding: 5px 9px;
    border-radius: 20px;
    border: 1px solid #383838;
    background: #171717;
    font-size: 8px;
    color: #aaa;
    letter-spacing: 1px;
    animation: badgeGlow 3s infinite;
}

@keyframes badgeGlow {
    50% {
        border-color: #777;
        color: #eee;
    }
}

/* KEY LABEL */

.key-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 9px;
}

.key-label span:first-child {
    font-size: 9px;
    color: #888;
    letter-spacing: 2px;
    font-weight: 700;
}

.key-label span:last-child {
    font-size: 8px;
    color: #555;
    letter-spacing: 1px;
}

/* KEY BOX */

.key-box {
    position: relative;
    height: 57px;
    display: flex;
    align-items: center;
    padding: 0 13px;
    border-radius: 12px;
    background: #050505;
    border: 1px solid #343434;
    overflow: hidden;
    transition: .35s ease;
}

/* Key box shine */

.key-box::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #ddd, transparent);
    animation: keyLine 4s infinite;
}

@keyframes keyLine {
    to { left: 100%; }
}

/* Key scanning */

.key-box::after {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.055),
        transparent
    );
    transform: skewX(-20deg);
    animation: keyScan 5s ease infinite;
    pointer-events: none;
}

@keyframes keyScan {
    0%,20% { left: -150%; }
    70%,100% { left: 150%; }
}

.key-box:hover {
    border-color: #777;
    box-shadow:
        0 0 20px rgba(255,255,255,.05),
        inset 0 0 15px rgba(255,255,255,.025);
    transform: translateY(-2px);
}

.key {
    width: 100%;
    font-size: 11px;
    color: #ddd;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    user-select: all;
    position: relative;
    z-index: 2;
    animation: keyTextGlow 4s ease infinite;
}

.key::-webkit-scrollbar {
    display: none;
}

@keyframes keyTextGlow {
    0%,100% { color: #aaa; }
    50% { color: #eee; }
}

/* KEY MENU FOOTER */

.key-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 11px;
}

.key-footer span {
    font-size: 8px;
    color: #555;
    letter-spacing: 1px;
}

.key-footer .ready {
    color: #aaa;
    display: flex;
    align-items: center;
    gap: 5px;
}

.ready::before {
    content: "";
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ddd;
    box-shadow: 0 0 7px #fff;
    animation: dotPulse 2s infinite;
}

/* ================= COPY BUTTON ================= */

.copy-button {
    position: relative;
    width: 100%;
    height: 55px;
    margin-top: 14px;
    overflow: hidden;
    border: 1px solid #aaa;
    border-radius: 12px;
    background: linear-gradient(120deg, #f0f0f0, #888, #ddd);
    background-size: 300% 300%;
    color: #050505;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .3s ease;
    animation: buttonGradient 5s ease infinite;
}

@keyframes buttonGradient {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* BUTTON LIGHT */

.copy-button::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.8),
        transparent
    );
    transform: skewX(-25deg);
    animation: buttonShine 3.5s infinite;
}

@keyframes buttonShine {
    0%,20% { left: -120%; }
    65%,100% { left: 150%; }
}

/* BUTTON GLOW */

.copy-button:hover {
    transform: translateY(-3px);
    box-shadow:
        0 10px 30px rgba(255,255,255,.15),
        0 0 20px rgba(255,255,255,.06);
    filter: brightness(1.12);
}

.copy-button:active {
    transform: scale(.96);
}

/* RIPPLE */

.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    transform: scale(0);
    animation: ripple .6s ease-out;
    pointer-events: none;
}

@keyframes ripple {
    to {
        transform: scale(4);
        opacity: 0;
    }
}

.copy-button.success {
    background: linear-gradient(120deg, #fff, #aaa, #eee);
}

/* ================= FOOTER ================= */

.footer {
    margin-top: 23px;
    text-align: center;
    font-size: 9px;
    color: #555;
    letter-spacing: 3px;
}

.footer strong {
    color: #aaa;
}

.footer-line {
    width: 45px;
    height: 2px;
    margin: 18px auto 0;
    background: linear-gradient(90deg, transparent, #aaa, transparent);
    animation: footerLine 3s infinite;
}

@keyframes footerLine {
    50% {
        width: 100px;
        opacity: .4;
    }
}

/* ================= PARTICLES ================= */

.particle {
    position: fixed;
    background: #ddd;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 7px #aaa;
    animation: particleMove linear infinite;
}

@keyframes particleMove {
    0% {
        transform: translateY(110vh) translateX(0);
        opacity: 0;
    }
    20% { opacity: .5; }
    80% { opacity: .3; }
    100% {
        transform: translateY(-10vh) translateX(50px);
        opacity: 0;
    }
}

/* ================= MOBILE ================= */

@media(max-width:480px) {
    .card {
        padding: 31px 20px 25px;
    }

    .title {
        font-size: 22px;
    }

    .key {
        font-size: 10px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="grid"></div>

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

<div class="scanner"></div>
<div id="particles"></div>

<div class="card" id="card">
    <div class="card-border"></div>
    <div class="card-inner"></div>
    <div class="card-light" id="cardLight"></div>

    <div class="content">

        <!-- PREMIUM A LOGO -->
        <div class="logo-area">

            <div class="outer-ring"></div>
            <div class="inner-ring"></div>

            <div class="logo-tile">

                <svg class="logo-svg"
                     viewBox="0 0 100 110"
                     xmlns="http://www.w3.org/2000/svg">

                    <defs>

                        <linearGradient id="metal"
                            x1="0" y1="0" x2="1" y2="1">

                            <stop offset="0%" stop-color="#fff"/>
                            <stop offset="20%" stop-color="#d9d9d9"/>
                            <stop offset="45%" stop-color="#777"/>
                            <stop offset="65%" stop-color="#eee"/>
                            <stop offset="85%" stop-color="#999"/>
                            <stop offset="100%" stop-color="#fff"/>

                        </linearGradient>

                        <linearGradient id="barMetal"
                            x1="0" y1="0" x2="0" y2="1">

                            <stop offset="0%" stop-color="#fff"/>
                            <stop offset="50%" stop-color="#aaa"/>
                            <stop offset="100%" stop-color="#eee"/>

                        </linearGradient>

                    </defs>

                    <path fill="url(#metal)"
                          stroke="rgba(255,255,255,.5)"
                          stroke-width=".5"
                          stroke-linejoin="bevel"
                          d="
                            M50 5
                            L5 105
                            L25 105
                            L50 49
                            L75 105
                            L95 105
                            Z
                          "/>

                    <path fill="url(#barMetal)"
                          d="
                            M32 72
                            L68 72
                            L75 86
                            L25 86
                            Z
                          "/>

                </svg>

            </div>
        </div>

        <h1 class="title">ADONIS <span>HUB</span></h1>
        <p class="subtitle">PREMIUM KEY SYSTEM</p>

        <!-- STATUS MENU -->
        <div class="status">
            <div class="dot"></div>
            <span class="status-text">SYSTEM OPERATIONAL</span>
        </div>

        <!-- ANIMATED KEY MENU -->
        <div class="key-section">

            <div class="key-content">

                <div class="key-header">

                    <div class="key-header-left">
                        <div class="key-icon">⌘</div>
                        <div class="key-header-title">KEY ACCESS</div>
                    </div>

                    <div class="key-badge">PREMIUM</div>

                </div>

                <div class="key-label">
                    <span>YOUR ACCESS KEY</span>
                    <span>SECURE ACCESS</span>
                </div>

                <div class="key-box">
                    <div class="key" id="keyText">
                        AdonisHubKeyKsbejwjOalisjwwjJsbwkwiPoajwjwj
                    </div>
                </div>

                <div class="key-footer">
                    <span>ADONIS AUTHENTICATION</span>
                    <span class="ready">KEY READY</span>
                </div>

            </div>
        </div>

        <!-- COPY -->
        <button class="copy-button" id="copyButton" onclick="copyKey()">
            COPY ACCESS KEY
        </button>

        <div class="footer">
            POWERED BY <strong>ADONIS HUB</strong>
        </div>

        <div class="footer-line"></div>

    </div>
</div>

<script>

/* ================= COPY ================= */

const key = "AdonisHubKeyKsbejwjOalisjwwjJsbwkwiPoajwjwj";

function copyKey() {

    const button = document.getElementById("copyButton");

    function copied() {
        button.innerHTML = "✓ KEY COPIED SUCCESSFULLY";
        button.classList.add("success");

        setTimeout(() => {
            button.innerHTML = "COPY ACCESS KEY";
            button.classList.remove("success");
        }, 2200);
    }

    function fallback() {
        const textarea = document.createElement("textarea");
        textarea.value = key;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);
        textarea.select();

        try {
            document.execCommand("copy");
            copied();
        } catch (e) {
            button.innerText = "PLEASE COPY MANUALLY";
        }

        textarea.remove();
    }

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(key)
            .then(copied)
            .catch(fallback);
    } else {
        fallback();
    }
}

/* ================= PARTICLES ================= */

const particles = document.getElementById("particles");

for (let i = 0; i < 70; i++) {

    const p = document.createElement("div");
    p.className = "particle";

    const size = Math.random() * 3 + 1;

    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = (5 + Math.random() * 15) + "s";
    p.style.animationDelay = Math.random() * 15 + "s";

    particles.appendChild(p);
}

/* ================= CARD LIGHT FOLLOW ================= */

const card = document.getElementById("card");
const cardLight = document.getElementById("cardLight");

card.addEventListener("mousemove", (e) => {

    const rect = card.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    cardLight.style.left = (x - 90) + "px";
    cardLight.style.top = (y - 90) + "px";

    if (window.innerWidth > 700) {

        const rotateX = (y / rect.height - .5) * -4;
        const rotateY = (x / rect.width - .5) * 4;

        card.style.transform =
            `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    }
});

card.addEventListener("mouseleave", () => {
    card.style.transform = "";
    cardLight.style.left = "-100px";
    cardLight.style.top = "-100px";
});

/* ================= RIPPLE ================= */

document.getElementById("copyButton")
.addEventListener("click", function(e) {

    const rect = this.getBoundingClientRect();

    const ripple = document.createElement("span");
    ripple.className = "ripple";

    const size = 80;

    ripple.style.width = size + "px";
    ripple.style.height = size + "px";

    ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
    ripple.style.top = (e.clientY - rect.top - size / 2) + "px";

    this.appendChild(ripple);

    setTimeout(() => ripple.remove(), 700);
});

/* ================= RANDOM FLASH ================= */

function createFlash() {

    const flash = document.createElement("div");

    flash.style.position = "fixed";
    flash.style.width = "2px";
    flash.style.height = "2px";
    flash.style.left = Math.random() * 100 + "%";
    flash.style.top = Math.random() * 100 + "%";
    flash.style.background = "#fff";
    flash.style.boxShadow = "0 0 20px 5px rgba(255,255,255,.1)";
    flash.style.pointerEvents = "none";
    flash.style.opacity = "0";
    flash.style.transition = "opacity .5s";

    document.body.appendChild(flash);

    requestAnimationFrame(() => {
        flash.style.opacity = ".7";
    });

    setTimeout(() => {
        flash.style.opacity = "0";
    }, 500);

    setTimeout(() => flash.remove(), 1000);
}

setInterval(createFlash, 3000);

</script>
